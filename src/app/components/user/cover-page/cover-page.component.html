<section class="ezy__signup1_PQS26JGS d-flex align-items-center">
  <div class="container">
    <div class="row py-4 justify-content-center">
      <div class="col-lg-12">
        <div class="card ezy__signup1_PQS26JGS-form-card">
          <div class="card-body p-md-5">
            <h2 class="ezy__signup1_PQS26JGS-heading mb-4 mb-md-5">Cover Page</h2>
            <div class="container">
              <div class="row">
                <!-- content -->
                <div class="col-12 col-md-12 col-lg-12 mt-5 mt-md-0" *ngIf="userCV">
                  <div class="ezy__epprofile5-card p-4">
                    <div class="px-lg-5">
                      <div class="row">
                        <form class="column">
                          <div class="col-lg-12">
                            <label for="file">Choose File:</label>
                            <input id="file" class="form-control" type="file" (change)="onFileChange($event)" required>
                          </div>
                          <br>
                          <button class="btn btn-primary" type="button" (click)="getCoverPage()">Upload</button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
